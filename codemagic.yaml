workflows:
  doormarket_ios_testflight:
    name: DoorMarket iOS -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120

    # Must match the App Store Connect integration name configured in Codemagic
    # Team settings -> Integrations.
    integrations:
      app_store_connect: DoorMarketASC

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        FLUTTER_PROJECT_DIR: DoorMarket.Flutter/doormarket_flutter
        BUNDLE_ID: com.doormarket.app
        API_BASE_URL: http://api.door-market.com
        BUILD_NAME: 1.0.0
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.doormarket.app

    scripts:
      - name: Flutter pub get
        script: |
          cd "$FLUTTER_PROJECT_DIR"
          flutter pub get

      - name: Build iOS IPA (App Store)
        script: |
          cd "$FLUTTER_PROJECT_DIR"
          flutter build ipa \
            --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --build-name="$BUILD_NAME" \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --export-method app-store

    artifacts:
      - DoorMarket.Flutter/doormarket_flutter/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
