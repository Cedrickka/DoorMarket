workflows:
  doormarket_ios_testflight:
    name: DoorMarket iOS -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120

    # Must match the App Store Connect integration name configured in Codemagic
    # Team settings -> Integrations.
    integrations:
      app_store_connect: DoorMarketASC

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        FLUTTER_PROJECT_DIR: DoorMarket.Flutter/doormarket_flutter
        XCODE_WORKSPACE: DoorMarket.Flutter/doormarket_flutter/ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
        BUNDLE_ID: com.doormarket.app
        API_BASE_URL: http://api.door-market.com
        BUILD_NAME: 1.0.0
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.doormarket.app

    scripts:
      - name: Initialize keychain
        script: |
          keychain initialize

      - name: Flutter pub get
        script: |
          cd "$FLUTTER_PROJECT_DIR"
          flutter pub get

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Apply iOS provisioning profiles
        script: |
          cd "$FLUTTER_PROJECT_DIR/ios"
          xcode-project use-profiles

      - name: Build iOS IPA (App Store)
        script: |
          cd "$FLUTTER_PROJECT_DIR"
          flutter build ipa \
            --release \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --build-name="$BUILD_NAME" \
            --build-number="$PROJECT_BUILD_NUMBER" \
            --export-method app-store

      - name: Verify IPA output
        script: |
          set -e
          IPA_DIR="$FLUTTER_PROJECT_DIR/build/ios/ipa"
          echo "Checking IPA directory: $IPA_DIR"
          ls -la "$IPA_DIR" || true

          IPA_PATH=$(find "$IPA_DIR" -maxdepth 1 -name "*.ipa" | head -n 1)
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA found in $IPA_DIR"
            echo "Build tree snapshot:"
            find "$FLUTTER_PROJECT_DIR/build/ios" -maxdepth 4 -type f | head -n 200 || true
            exit 1
          fi

          echo "IPA found: $IPA_PATH"

    artifacts:
      - $CM_BUILD_DIR/DoorMarket.Flutter/doormarket_flutter/build/ios/ipa/*.ipa
      - DoorMarket.Flutter/doormarket_flutter/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # Keep upload-only for initial stabilization. Enable automated TestFlight
        # submission later once uploads are confirmed visible in App Store Connect.
        submit_to_testflight: false
