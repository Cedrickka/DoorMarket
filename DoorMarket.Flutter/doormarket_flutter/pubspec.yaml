name: doormarket_flutter
description: DoorMarket UI prototype in Flutter (Light/Dark)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.7.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_tts: ^4.0.2
  shared_preferences: ^2.3.2
  file_picker: ^8.1.2
  intl: ^0.20.2
  url_launcher: ^6.3.0
  http_parser: ^4.1.2
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
          weight: 400
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
