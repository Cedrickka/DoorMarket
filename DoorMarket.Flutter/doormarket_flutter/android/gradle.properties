org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Network hardening for flaky TLS/download links (prevents transient bad_record_mac failures).
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000
org.gradle.internal.repository.max.retries=6
org.gradle.internal.repository.initial.backoff=1000
# Force stable TLS stack on problematic networks/proxies.
systemProp.https.protocols=TLSv1.2
systemProp.jdk.tls.client.protocols=TLSv1.2
systemProp.java.net.preferIPv4Stack=true
# Stabilize Kotlin compilation on Windows when project is opened via mapped drives (X:) and
# dependencies are resolved from another root (C:).
kotlin.incremental=false
kotlin.caching.enabled=false
kotlin.compiler.execution.strategy=in-process
