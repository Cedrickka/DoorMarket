name: security-secrets-scan

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop

jobs:
  scan:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secrets scan
        shell: pwsh
        run: ./scripts/security/check-secrets.ps1 -Root .
